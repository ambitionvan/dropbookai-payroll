// ---------- SHA-256 (no crypto.subtle: works from a file and on any phone)
function sha256(str){
  function rr(n, x){ return (x >>> n) | (x << (32 - n)); }

  function isP(m){ for (var k = 2; k * k <= m; k++) if (m % k === 0) return false; return true; }

  for (n = 0; n < 64; p++) if (isP(p)) { if (n < 8) H[n] = fr(Math.pow(p, 1/2)); K[n++] = fr(Math.pow(p, 1/3)); }
  var b = unescape(encodeURIComponent(str)), w = [], l = b.length * 8;
  for (i = 0; i < b.length; i++) w[i >> 2] |= b.charCodeAt(i) << ((3 - i % 4) * 8);
  w[l >> 5] |= 0x80 << (24 - l % 32); w[((l + 64 >> 9) << 4) + 15] = l;
  for (j = 0; j < w.length; j += 16) {
    var a = H.slice(0), W = [];
    for (i = 0; i < 64; i++) {
      if (i < 16) W[i] = w[j + i] | 0;
      else W[i] = (rr(17, W[i-2]) ^ rr(19, W[i-2]) ^ (W[i-2] >>> 10)) + W[i-7] + (rr(7, W[i-15]) ^ rr(18, W[i-15]) ^ (W[i-15] >>> 3)) + W[i-16] | 0;
      var t1 = a[7] + (rr(6, a[4]) ^ rr(11, a[4]) ^ rr(25, a[4])) + ((a[4] & a[5]) ^ (~a[4] & a[6])) + K[i] + W[i] | 0;
      var t2 = (rr(2, a[0]) ^ rr(13, a[0]) ^ rr(22, a[0])) + ((a[0] & a[1]) ^ (a[0] & a[2]) ^ (a[1] & a[2])) | 0;
      a = [t1 + t2 | 0].concat(a); a[4] = a[4] + t1 | 0; a.length = 8;
    }
    for (i = 0; i < 8; i++) H[i] = H[i] + a[i] | 0;
  }
  return H.map(function(x){ return ('00000000' + (x >>> 0).toString(16)).slice(-8); }).join('');
}

// ---------- a tiny PDF (text only, Helvetica) for payslips
function pdf(lines, title){

  var y = 770, ops = ['BT', '/F1 10 Tf'];

    ops.push((big ? '/F2 13 Tf ' : '/F1 10 Tf ') + '1 0 0 1 50 ' + y + ' Tm (' + enc(t) + ') Tj'); y -= big ? 20 : 14;
  });
  ops.push('ET');
  var content = ops.join('\n');
  var objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',

    '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream', '<< /Title (' + enc(title || '') + ') /Producer (DropBookAI) >>'];
  var out = '%PDF-1.4\n', off = [];
  objs.forEach(function(o, i){ off.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  var x = out.length;

  return out;
}

// ---------- pay periods
function periodFor(freq, anchorEnd){
  var to = anchorEnd || today(), d = new Date(to + 'T00:00:00Z');   // semi / monthly: the period holding this day
  if (freq === 'semi') { var day = d.getUTCDate(), y = d.getUTCFullYear(), m = d.getUTCMonth();
    if (day <= 15) return {from: iso(y, m, 1), to: iso(y, m, 15)};
    return {from: iso(y, m, 16), to: iso(y, m + 1, 0)}; }
  if (freq === 'monthly') return {from: iso(d.getUTCFullYear(), d.getUTCMonth(), 1), to: iso(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)};
  var n = freq === 'weekly' ? 7 : 14; return {from: DBPay.addDays(to, -(n - 1)), to: to};
}
function iso(y, m, d){ return new Date(Date.UTC(y, m, d)).toISOString().slice(0, 10); }

  if (!last) return periodFor(f, today());
  var nx = DBPay.addDays(last, 1);
  if (f === 'semi' || f === 'monthly') return periodFor(f, nx);
  return {from: nx, to: DBPay.addDays(last, f === 'weekly' ? 7 : 14)};
}

// read + check the form -> {P (no SIN), sin}
function detRead(px, name){
  var P = {name: name, birth: pv(px + 'birth'), street1: pv(px + 'street1'), street2: pv(px + 'street2'), city: pv(px + 'city'), province: pv(px + 'province'),

  var sin = pv(px + 'sin').replace(/\D/g, ''), ok = document.getElementById(px + 'td1ok') && document.getElementById(px + 'td1ok').checked;
  if (!P.name) throw new Error(T('要填名字','the name, please'));

  if (P.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(P.email)) throw new Error(T('电邮不对','the email is not right'));
  ['td1_fed', 'td1_bc'].forEach(function(k){ if (P[k] && !(+P[k] >= 0)) throw new Error(T('TD1 金额要是数字','the TD1 amount must be a number')); });
  if (sin && !luhn(sin)) throw new Error(T('SIN 不对（9 位，最后一位是检查码）：再看一下，或者留空、打电话给会计','the SIN is not right (9 digits with a check digit): check it, or leave it blank and phone the accountant'));
  if (sin && !canLock()) throw new Error(T('这台设备不能加密 SIN：请留空、打电话给会计','this device cannot lock the SIN: leave it blank and phone the accountant'));
  if ((P.td1_fed || P.td1_bc) && !ok) throw new Error(T('填了 TD1 就要勾「确认」','tick the TD1 confirmation'));
  P.td1_confirmed = ok ? nowStr() : '';

function docName(month, side, i, f){
  var ext = (/\.([A-Za-z0-9]{2,5})$/.exec(f.name || '') || [])[1] || ({'image/png':'png','image/heic':'heic','image/heif':'heif','image/webp':'webp'}[f.type] || 'jpg');

  var st = nowStr().replace(/[-: ]/g, '').slice(0, 14);
  return month + '_' + (side === 'deposit' ? 'deposit' : 'bill') + '_' + co + '_' + st + '_' + (i + 1) + '.' + ext.toLowerCase().replace('jpeg', 'jpg');
}
function pickPhotos(){
  var month = document.getElementById('d-month').value, side = document.getElementById('d-side').value;
  if (!/^20\d\d-(0[1-9]|1[0-2])$/.test(month)) throw new Error(T('先选月份','choose the month first'));
  S.docMonth = month; S.docSide = side; save();
  var i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
  i.onchange = function(){
    var start = pending.length;
    Array.prototype.forEach.call(i.files, function(f, k){
      pending.push({file: new File([f], docName(month, side, start + k, f), {type: f.type || 'image/jpeg'}), url: URL.createObjectURL(f)});
    });
    tab = 'docs'; render();
  };

}
function shareDocs(){                                         // a second tap: a phone shares only from a tap
  var files = pending.map(function(x){ return x.file; });
  var done = function(){ files.forEach(function(f){ S.sent.push({name: f.name, at: nowStr()}); }); S.sent = S.sent.slice(-200);
    pending.forEach(function(x){ URL.revokeObjectURL(x.url); }); pending = []; save(); render(); };
  if (navigator.canShare && navigator.canShare({files: files})) {
    navigator.share({files: files}).then(done).catch(function(e){ if (!e || e.name !== 'AbortError') alertBox(T('没有分享出去：','Not shared: ') + esc(e && e.message || e)); });
    return;
  }
  files.forEach(function(f, k){ setTimeout(function(){                 // a computer: downloads -- then put them in the Drive folder
    var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000); }, k * 400); });
  done();
}

function cnVal(id, whole){
  var raw = (S.countDraft || {})[id];
  if (raw === undefined || raw === '') return null;
  var v = Number(raw);
  if (!(v >= 0) || (whole && v % 1)) throw new Error(T('数字不对：','Not a right number: ') + esc(raw));
  return v;
}
function readCount(){
  var d = S.countDraft || {}, C = S.countSetup, items = [], skipped = [];
  var day = d['cn-date'] || today(), shift = d['cn-shift'] || 'Night';
  if (!/^20\d\d-\d\d-\d\d$/.test(day)) throw new Error(T('先选营业日','choose the business day first'));
  C.items.forEach(function(it, i){
    var parts = [], any = false, total = 0;
    it.forms.forEach(function(f, k){
      var n = cnVal(cnId(i, k, 'n')), o = f.kind === 'pack' ? null : cnVal(cnId(i, k, 'o'), true);
      if (n === null && o === null) return;
      if (o !== null && o > 9) throw new Error(esc(it.plu) + T('：开着的只能填 0 到 9 成',': the open one is 0 to 9 tenths'));
      any = true;
      parts.push({label: f.label, units: f.units, kind: f.kind, n: n || 0, open: o || 0});
      total += (n || 0) * f.units + (o || 0) / 10 * f.units;
    });
    var s = it.loose ? cnVal(cnId(i, 'x', 's')) : null;
    if (s !== null) { any = true; total += s; }
    if (!any) { skipped.push(it.plu); return; }
    items.push({plu: it.plu, total: Math.round(total * 1000) / 1000, parts: parts, loose: s || 0});
  });
  return {date: day, shift: shift, items: items, skipped: skipped};
}
function sendCount(){
  var r = readCount(), C = S.countSetup;
  if (!r.items.length) throw new Error(T('一项都没填','nothing is filled in'));

  var co = C.company.replace(/[^A-Za-z0-9]+/g, '_');
  var body = {kind:'count', app_version: APP_VERSION, company: C.company, setup_made: C.made, date: r.date, shift: r.shift, by: who(), made_at: nowStr(), items: r.items, skipped: r.skipped};
  var name = 'count_' + co + '_' + r.date + '_' + r.shift + '_' + nowStr().replace(/[-: ]/g, '') + '.json', text = sealed(body);
  S.counts.push({name: name, text: text, date: r.date, shift: r.shift, n: r.items.length, skipped: r.skipped.length, at: nowStr()});
  S.counts = S.counts.slice(-60); S.countDraft = {}; cnWarn = false; save();
  give(name, text); tab = 'counted'; render();
}

// ================= actions =================
function who(){ var n = S.role === 'boss' ? S.boss : S.me; if (!n) throw new Error(T('先在「设置」里写你的名字','first put your name in Settings')); return n; }
function rowById(id){ return S.rows.filter(function(r){ return r.id === id; })[0]; }
// a pay run already confirmed: the period it covers, and the shifts it counted (user's iPhone test 2026-10-27: a new
// shift typed into a paid period could be saved, then not deleted)
function paidRun(day){ return S.runs.filter(function(x){ return !x.voided && day >= x.period_from && day <= x.period_to; })[0]; }
function inRun(r){ return S.runs.filter(function(x){ return !x.voided && (x.rows || []).some(function(y){ return y.id === r.id; }); })[0]; }
function paidMsg(x){ return T('这一天在已经发过的工资期里（' + x.period_from + ' 至 ' + x.period_to + '，' + x.no + '）。要补这一天：那一期还没导出给会计，就到「已发」把它作废，补上再重新发；已经导出了，请联系会计事务所。',
  'This day is in a pay period already paid (' + x.period_from + ' to ' + x.period_to + ', ' + x.no + '). To add it: if that run is not yet sent to the accountant, void it under Paid, add the shift and pay again; if it was sent, ask the accounting office.'); }
function editRow(id){
  var r = rowById(id), f = document.getElementById('dlgf'), whoami = S.role;
  if (inRun(r)) throw new Error(T('这一条已经算进 ' + inRun(r).no + ' 发了工资，不能改','this shift is in pay run ' + inRun(r).no + ' -- it cannot be changed'));
  f.innerHTML = '<h2>' + T('改这一天','Change this shift') + '</h2>' + rowForm(r, whoami) + '<div style="text-align:right"><button value="cancel">' + T('取消','Cancel') + '</button> <button class="pri" id="dsave" value="ok">' + T('保存','Save') + '</button></div>';
  document.getElementById('dlg').showModal();
  document.getElementById('dsave').onclick = function(ev){
    try {
      var n = readForm(whoami);
      if (S.role === 'boss' && paidRun(n.date)) throw new Error(paidMsg(paidRun(n.date)));
      var c = clashOf(n, r.emp, r.id); if (c) throw new Error(clashMsg(c));
      if (S.role === 'boss' && r.src === 'emp') {             // the boss changes an employee's line: keep what the employee wrote
        r.edits = r.edits || []; var before = {};
        ['date','start','end','break','ot_from','ot_to','stat','rate','bonus','note'].forEach(function(k){ before[k] = r[k]; });
        r.edits.push({at: nowStr(), by: who(), from: before});
      }
      Object.assign(r, n); if (S.role === 'boss') r.use_manual = !!r.ot_from;
      if (S.role === 'boss' && r.src === 'emp') r.approved = null;
      save(); render();
    } catch (e) { ev.preventDefault(); alertBox(esc(e.message)); }
  };
}
function addRow(src){
  var r = readForm(src === 'emp' ? 'emp' : 'boss');
  if (src === 'boss' && paidRun(r.date)) throw new Error(paidMsg(paidRun(r.date)));
  var c = clashOf(r, src === 'emp' ? S.me : selEmp); if (c) throw new Error(clashMsg(c));
  r.id = uid(); r.emp = src === 'emp' ? S.me : selEmp; r.src = src; r.made = nowStr();
  if (src === 'boss') { r.approved = {by: who(), at: nowStr()}; r.use_manual = !!r.ot_from; }
  S.rows.push(r); save(); render();
}
function importText(text, name){
  var o = unseal(text);
  if (o.kind === 'setup') {
    if (S.setup && S.setup.company !== o.company) {
      var was = S.setup.company, cs = S.countSetup && S.countSetup.company === o.company ? S : null; switchTo(o.company, o);
      if (cs && !S.countSetup) { S.countSetup = cs.countSetup; S.counts = cs.counts; S.countDraft = cs.countDraft; save(); }
      render();
      return T('已换到 ','Now on ') + esc(o.company) + ' · ' + o.employees.length + T(' 位员工',' employee(s)') + '<br>'
        + T(esc(was) + ' 的资料还在这台设备上：「备份 / 设置 → 公司」可以换回去。', 'The data of ' + esc(was) + ' stays on this device: Backup / settings → Company switches back.');
    }
    S.setup = o; S.role = 'boss'; save(); tab = 'home'; render(); return T('已导入设置：','Setup imported: ') + esc(o.company) + ' · ' + o.employees.length + T(' 位员工',' employee(s)');
  }
  if (o.kind === 'hours') {
    if (S.role !== 'boss') throw new Error(T('工时文件要在老板那边导入','hours files are imported on the owner\'s device'));
    var n = 0, dup = 0, late = [], clash = [];
    o.rows.forEach(function(r){
      if (paidRun(r.date)) { late.push(r.date); return; }       // its period is paid already: not added, said below
      var same = S.rows.filter(function(x){ return x.emp === o.employee && x.date === r.date && x.start === r.start; })[0];
      if (same) { dup++; return; }                              // the same shift again: kept once (the first one)
      if (clashOf(r, o.employee)) { clash.push(r.date + ' ' + r.start + '–' + r.end); return; }   // overlaps one already here: not added, said below
      var e = emp(o.employee) || {};
      S.rows.push(Object.assign({}, r, {id: uid(), emp: o.employee, src: 'emp', rate: r.rate || e.rate || 0, bonus: 0, approved: null, use_manual: !!r.ot_from,
        sub: o.sha256 || '', received: nowStr()}));
      n++;
    });
    S.subs.push({emp: o.employee, from: o.from, to: o.to, rows: n, dup: dup, late: late, clash: clash, at: nowStr(), file: name});
    save(); tab = 'inbox'; render();
    return esc(o.employee) + ': ' + n + T(' 天收到',' shift(s) in') + (dup ? T('，' + dup + ' 天重复（已有，没再加）', ', ' + dup + ' already there (not added again)') : '') + (clash.length ? '<br><b style="color:#b91c1c">' + T(clash.length + ' 条和已有的时间重叠，没加：','' + clash.length + ' overlap shifts already here, not added: ') + esc(clash.join(', ')) + '</b>' : '')
      + (late.length ? '<br>' + T(late.length + ' 天在已经发过工资的期间里，没有加：', late.length + ' shift(s) fall in a period already paid, not added: ') + esc(late.join(', '))
        + T('。要补，先作废那一期，或联系会计事务所。', '. To add them, void that run first, or ask the accounting office.') : '');
  }
  if (o.kind === 'backup') {
    var bco = ((o.data || {}).setup || {}).company;
    if (S.setup && bco && bco !== S.setup.company) localStorage.setItem(CO_KEY + S.setup.company, JSON.stringify(S));   // another company's backup: keep this one
    if (bco) localStorage.removeItem(CO_KEY + bco);
    var keep = S.lang; S = Object.assign(blank(), o.data); S.lang = keep; save(); render(); return T('已还原备份 ','Backup restored ') + esc(o.made) + (bco ? ' · ' + esc(bco) : ''); }
  if (o.kind === 'count_setup') {
    if (S.setup && S.setup.company !== o.company && localStorage.getItem(CO_KEY + o.company)) switchTo(o.company);
    S.countSetup = o; S.countDraft = {}; cnWarn = false; S.role = 'count'; save(); tab = 'count'; render();
    return T('已导入盘点文件：','Count file imported: ') + esc(o.company) + ' · ' + o.items.length + T(' 项',' PLUs');
  }
  if (o.kind === 'my_setup') {                                  // 2026-11-21: an employee's own file (only this person) -> the estimate
    if (S.role === 'boss') throw new Error(T('这是给员工手机的文件（「我的估算文件」），在员工的手机上导入','this is the file for the employee\'s phone ("my estimate file"): import it on the employee\'s phone'));
    if (S.me && S.me !== o.employee.name && S.mySetup) throw new Error(T('这个文件是 ' + o.employee.name + ' 的，这台手机是 ' + S.me + ' 的','this file is for ' + o.employee.name + '; this phone is ' + S.me + '\'s'));
    S.mySetup = o; S.role = 'emp'; S.me = o.employee.name; save(); tab = 'my'; render();
    return T('已导入：','Imported: ') + esc(o.employee.name) + ' · ' + esc(o.company) + T('。「我的工时」页现在会估算这一期的扣款和实发。',': the My hours screen now estimates this period\'s deductions and take-home pay.');
  }
  if (o.kind === 'profile') {                                   // 2026-11-24 (plan 28 A): a new employee's own details (the SIN locked)
    if (S.role !== 'boss') throw new Error(T('员工资料文件要在老板那边导入','employee details files are imported on the owner\'s device'));
    if (!S.setup) throw new Error(T('先导入公司的设置文件','import the company setup file first'));
    if (o.company && o.company !== S.setup.company) throw new Error(T('这个文件是 ' + o.company + ' 的，现在用的是 ' + S.setup.company,'this file is for ' + o.company + '; the app is on ' + S.setup.company));
    var sh = sha256(text); S.profiles = S.profiles || [];
    if (S.profiles.some(function(p){ return p.sha === sh; })) { tab = 'inbox'; render(); return T('这一份已经导入过了','this file is in already'); }
    S.profiles.forEach(function(p){ if (p.status === 'pending' && p.data.name === o.name) p.status = 'replaced'; });   // the latest copy counts
    S.profiles.push({sha: sh, received: nowStr(), status: 'pending', data: o}); save(); tab = 'inbox'; render();
    return T('收到 ' + esc(o.name) + ' 的资料，在「员工交来的」批准。','Details from ' + esc(o.name) + ' are in: approve them under From employees.');
  }
  if (o.kind === 'remit_status') {                              // 2026-11-21: from the office -- what the company owes CRA (totals only)
    if (S.role !== 'boss') throw new Error(T('源扣款状态文件要在老板那边导入','the source deductions file is imported on the owner\'s device'));
    if (S.setup && S.setup.company !== o.company) throw new Error(T('这个文件是 ' + o.company + ' 的，现在用的是 ' + S.setup.company + '（先在「备份 / 设置」换公司）','this file is for ' + o.company + '; the app is on ' + S.setup.company + ' (switch company in Backup / settings first)'));
    if (S.remit && S.remit.made > o.made) throw new Error(T('这个文件比已经导入的旧（' + o.made + ' < ' + S.remit.made + '），没有用','this file is older than the one already in (' + o.made + ' < ' + S.remit.made + '): not used'));
    S.remit = o; save(); tab = S.setup ? 'home' : tab; render();
    return T('已导入源扣款状态（截至 ','Source deductions status imported (as of ') + esc(o.made) + T('）：还欠 CRA ','): owing CRA ') + money(o.owing) + (o.next_due ? T('，下次截止 ',', next due ') + esc(o.next_due) : '');
  }
  throw new Error(T('看不懂这个文件','not a file this app knows'));
}
function calc(){
  var from = document.getElementById('p-from').value, to = document.getElementById('p-to').value, pay = document.getElementById('p-pay').value;
  if (!from || !to || !pay || from > to) throw new Error(T('工资期日期不对','the period dates are not right'));
  if (pay < to) throw new Error(T('发薪日不能早于工资期结束','the pay date cannot be before the period ends'));
  var flags = [];
  if ((new Date(pay) - new Date(to)) / 86400000 > 8) flags.push({bad:true, block:true, text:T('BC：工资期结束后 8 天内要发薪','BC: wages are paid within 8 days of the period end')});
  if (S.runs.some(function(r){ return !r.voided && r.period_to === to; })) flags.push({bad:true, block:true, text:T('这一期已经发过了','this period is already paid')});
  var list = active(to), inputs = {}, statDate = '', detail = {};
  list.forEach(function(e){
    var vq = document.querySelector('.p-vac[data-n="' + CSS.escape(e.name) + '"]'), vd = vq && vq.value ? vq.value : '';
    if (vd && (isNaN(+vd) || +vd < 0)) throw new Error(e.name + ': ' + T('休假天数不对','vacation days?'));
    if (vd && vacBank(e, to).left - +vd < 0) flags.push({bad:true, text: e.name + ': ' + T('休假超过剩下的天数（' + vacBank(e, to).left + ' 天）','vacation days are more than the days left (' + vacBank(e, to).left + ')')});
    if (e.type === 'sal') { var b = document.querySelector('.p-bon[data-n="' + CSS.escape(e.name) + '"]'); inputs[e.name] = {bonus: b && b.value ? b.value : '', vac: vd}; return; }
    var rows = rowsOf(e.name);
    var inPer = rows.filter(function(r){ return r.date >= from && r.date <= to; });
    var pend = inPer.filter(function(r){ return !r.approved; });
    if (pend.length) flags.push({bad:true, block:true, text: e.name + ': ' + pend.length + T(' 天工时还没批准',' shift(s) not approved yet')});
    var ov = inPer.filter(function(r){ return clashOf(r, e.name, r.id); });
    if (ov.length) flags.push({bad:true, block:true, text: e.name + ': ' + ov.length + T(' 条工时时间互相重叠（' + ov.map(function(r){ return r.date + ' ' + r.start; }).join(', ') + '）：先到「工时」改日期或删掉重复的',' shifts overlap each other (' + ov.map(function(r){ return r.date + ' ' + r.start; }).join(', ') + '): fix the dates or delete the repeats under Hours first')});
    var ts = DBPay.timesheet(rows.map(calcRow), from, to, (S.setup.week_start === undefined ? 6 : S.setup.week_start));
    ts.days.forEach(function(d){ if (d.flag) flags.push({bad: d.flag.indexOf('LESS') >= 0, text: e.name + ' ' + d.date + ': ' + (d.flag.indexOf('LESS') >= 0 ? T('手填的加班少于 BC 规定（照 BC 规定算）','the overtime typed in is less than BC requires (paid as BC requires)') : T('手填的加班多于 BC 规定（照手填的付）','the overtime typed in is more than BC requires (paid as typed)'))}); });
    inPer.forEach(function(r){ if (r.stat && !statDate) statDate = r.date; });
    inputs[e.name] = {reg: ts.reg, ot: ts.ot, dt: ts.dt, stat: ts.stat, bonus: ts.bonus || '', pay: ts.pay, vac: vd};
    detail[e.name] = ts;
  });
  var result = DBPay.compute(TABLES, list, inputs, P_OF[S.setup.freq], statDate, pay, ytdBefore(pay));
  lastRun = {no: '', period_from: from, period_to: to, pay_date: pay, freq: S.setup.freq, stat_date: statDate, inputs: inputs, detail: detail,
    week_start: (S.setup.week_start === undefined ? 6 : S.setup.week_start),
    result: result, remit_due: remitDue(pay, S.setup.remitter || 'regular'), flags: flags, posted: false};
  render();
}
function post(){
  var R = lastRun; if (!R || R.posted) return;
  var y = R.pay_date.slice(0, 4);
  R.no = 'APP-' + y + '-' + ('0' + (S.runs.filter(function(r){ return r.pay_date.slice(0, 4) === y; }).length + 1)).slice(-2);
  R.posted = nowStr(); R.by = who();
  R.employees = active(R.period_to).map(function(e){ return Object.assign({}, e); });
  R.rows = S.rows.filter(function(r){ var e = emp(r.emp); return e && e.type !== 'sal' && r.date >= DBPay.addDays(R.period_from, -6) && r.date <= R.period_to; });
  S.runs.push(JSON.parse(JSON.stringify(R))); save(); render();
  if (Number(R.result.remit) > 0) alertBox(T('这一期要交 CRA $' + money(R.result.remit) + '，截止 ' + esc(R.remit_due) + '。主页「要交给 CRA 的源扣款」会提醒；按「加到 iPhone 日历」就有前 7 天、前 2 天的提醒。',
    'This run owes CRA $' + money(R.result.remit) + ', due ' + esc(R.remit_due) + '. Home: Source deductions owed to CRA reminds you; Add to the iPhone calendar sets reminders 7 and 2 days before.'));
}
function runByNo(no){ return S.runs.filter(function(r){ return r.no === no; })[0]; }
function payslips(no){
  var R = runByNo(no), Y = ytdBefore(DBPay.addDays(R.pay_date, 1)), out = [];
  R.result.rows.forEach(function(x){
    var e = emp(x.name) || {}, y = Y[x.name] || {};
    var L = ['#' + S.setup.company, '#PAY STATEMENT  ' + R.period_from + ' to ' + R.period_to + '   paid ' + R.pay_date, '',
      'Employee   ' + x.name, '', 'EARNINGS'];
    if (x.type === 'hourly') {
      L.push(pad('  Regular hours', hrs(x.hours.reg)), pad('  Overtime hours (1.5x)', hrs(x.hours.ot)), pad('  Double time hours (2x)', hrs(x.hours.dt)));
      if (x.hours.stat) L.push(pad('  Stat holiday hours', hrs(x.hours.stat)));
    }
    L.push(pad('  Regular pay', money(x.base)), pad('  Overtime pay', money(x.ot_pay)));
    if (x.stat_pay) L.push(pad('  Stat holiday pay', money(x.stat_pay)));
    if (x.bonus) L.push(pad('  Bonus', money(x.bonus)));
    if (x.vac_pay) L.push(pad('  Vacation pay', money(x.vac_pay)));
    L.push(pad('  GROSS', money(x.gross)), '', 'DEDUCTIONS', pad('  CPP', money(x.cpp)));
    if (x.cpp2) L.push(pad('  CPP2', money(x.cpp2)));
    L.push(pad('  EI', money(x.ei)), pad('  Federal income tax', money(x.fed)), pad('  BC income tax', money(x.bc)), '', pad('NET PAY', money(x.net)), '',
      'YEAR TO DATE', pad('  Gross', money(y.gross)), pad('  CPP', money(y.cpp)), pad('  CPP2', money(y.cpp2)), pad('  EI', money(y.ei)), '',
      'Tax tables: ' + R.result.edition + '.  Prepared with DropBookAI.');
    out.push({name: 'Payslip_' + R.pay_date + '_' + x.name.replace(/[^A-Za-z0-9]+/g, '_') + '.pdf', data: pdf(L, 'Payslip ' + x.name), type: 'application/pdf'});
  });
  giveMany(out);
}
function pad(a, b){ var s = a; while (s.length + String(b).length < 52) s += ' '; return s + b; }
function exportRun(no){
  var R = runByNo(no);
  var body = {kind:'payrun', app_version: APP_VERSION, company: S.setup.company, setup_made: S.setup.made, run: R, made_at: nowStr(), by: who()};
  give('payrun_' + S.setup.company.replace(/[^A-Za-z0-9]+/g, '_') + '_' + R.period_to + '.json', sealed(body));
  R.exported = nowStr(); save(); render();
}

// ================= events =================
document.addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if (!b) return;
  try {
    if (b.parentNode && b.parentNode.id === 'nav') { tab = b.getAttribute('data-t'); render(); return; }
    if (b.id === 'lang') { S.lang = S.lang === 'en' ? 'zh' : 'en'; save(); render(); return; }
    var a = b.getAttribute('data-a'), id = b.getAttribute('data-id');
    if (!a) return;
    if (a === 'role-boss') { S.role = 'boss'; tab = S.setup ? 'home' : 'hours'; save(); render(); }
    else if (a === 'go-pay') { S.role = 'boss'; tab = 'hours'; save(); render(); }
    else if (a === 'go-docs') { S.role = 'boss'; tab = 'docs'; save(); render(); }
    else if (a === 'go-count') { S.role = 'count'; S.me = S.me || S.boss; tab = 'count'; save(); render(); }
    else if (a === 'role-emp') { S.role = 'emp'; tab = 'my'; save(); render(); }
    else if (a === 'me') { var v = document.getElementById('me').value.trim(); if (!v) throw new Error(T('写名字','type your name')); S.me = v; save(); render(); }
    else if (a === 'add-mine') addRow('emp');
    else if (a === 'add-boss') addRow('boss');
    else if (a === 'edit') editRow(id);
    else if (a === 'del') { var r = rowById(id); if (inRun(r)) throw new Error(T('这一条已经算进 ' + inRun(r).no + ' 发了工资，不能删','this shift is in pay run ' + inRun(r).no + ' -- it cannot be deleted')); S.rows = S.rows.filter(function(x){ return x.id !== id; }); save(); render(); }
    else if (a === 'approve1') { rowById(id).approved = {by: who(), at: nowStr()}; save(); render(); }
    else if (a === 'approve-all') { var n = b.getAttribute('data-n'), w = who(), at = nowStr(); S.rows.forEach(function(r){ if (r.emp === n && r.src === 'emp' && !r.approved) r.approved = {by: w, at: at}; }); save(); render(); }
    else if (a === 'send-hours') {
      var f = document.getElementById('s-from').value, t = document.getElementById('s-to').value;
      var rows = S.rows.filter(function(r){ return r.emp === S.me && r.date >= f && r.date <= t; }).map(function(r){ return {date:r.date, start:r.start, end:r.end, 'break':r['break'], ot_from:r.ot_from, ot_to:r.ot_to, stat:r.stat, note:r.note}; });
      if (!rows.length) throw new Error(T('这段时间没有记录','no shifts in these dates'));
      var body = JSON.stringify({kind:'hours', app_version: APP_VERSION, employee: S.me, from: f, to: t, rows: rows, made_at: nowStr()});
      var o = JSON.parse(body); o.sha256 = sha256(body);
      give('hours_' + S.me.replace(/[^A-Za-z0-9]+/g, '_') + '_' + f + '_' + t + '.json', JSON.stringify({sha256: o.sha256, body: body}));
    }
    else if (a === 'st-my') { var e7 = emps()[+b.getAttribute('data-i')], t7 = today(), Y7 = ytdBefore(t7.slice(0, 4) + '-12-31T')[e7.name] || {};   // every run of the year in this app, a later pay date too
      var thr7 = [(S.setup || {}).ytd_through || ''].concat(S.runs.filter(function(r){ return !r.voided && r.pay_date.slice(0, 4) === t7.slice(0, 4); }).map(function(r){ return r.period_to; })).sort().pop();
      var o7 = {kind: 'my_setup', company: S.setup.company, made: nowStr(), by: who(), freq: S.setup.freq, week_start: S.setup.week_start,
        employee: Object.assign(JSON.parse(JSON.stringify(e7)), {vac: {year: t7.slice(0, 4), taken: vacBank(e7, t7).taken}}), ytd: {year: t7.slice(0, 4), gross: Y7.gross || 0, cpp: Y7.cpp || 0, cpp2: Y7.cpp2 || 0, ei: Y7.ei || 0}, ytd_through: thr7 || ''};
      give('my_' + e7.name.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') + '.json', sealed(o7), 'application/json'); }
    else if (a === 'import') pick('.json,application/json', function(text, name){ try { alertBox(importText(text, name)); } catch (e) { alertBox(esc(name) + ': ' + esc(e.message)); } });
    else if (a === 'me-send') meSend();
    else if (a === 'st-det') staffDlg(+b.getAttribute('data-i'));
    else if (a === 'st-new') staffDlg(null);
    else if (a === 'remit-paid') remitPaid(b.getAttribute('data-due'), +b.getAttribute('data-amt'));
    else if (a === 'remit-unpaid') { S.remitPaid = (S.remitPaid || []).filter(function(x){ return x.id !== b.getAttribute('data-id'); }); save(); render(); }
    else if (a === 'me-resend') give(S.profileSent.name, S.profileSent.text);
    else if (a === 'go-inbox') { tab = 'inbox'; render(); }
    else if (a === 'prof-ok') profOk(+b.getAttribute('data-i'));
    else if (a === 'prof-no') { var pn = S.profiles[+b.getAttribute('data-i')]; pn.status = 'rejected'; pn.rejected = {by: who(), at: nowStr()}; save(); render(); }
    else if (a === 'prof-resend') profFile(S.profiles[+b.getAttribute('data-i')]);
    else if (a === 'remit-cal') remitCal(false);
    else if (a === 'remit-cal-share') remitCal(true);
    else if (a === 'calc') calc();
    else if (a === 'post') post();
    else if (a === 'slips') payslips(b.getAttribute('data-no'));
    else if (a === 'export-run') exportRun(b.getAttribute('data-no'));
    else if (a === 'void') { var R = runByNo(b.getAttribute('data-no')); R.voided = nowStr(); R.voided_by = who(); save(); render(); }
    else if (a === 'st-save') { var i = +b.getAttribute('data-i'), e = emps()[i], pv = document.querySelector('.st-pay[data-i="' + i + '"]').value, lv = document.querySelector('.st-left[data-i="' + i + '"]').value;
      e.changes = e.changes || []; e.changes.push({at: nowStr(), by: who(), rate: e.rate, salary: e.salary, left: e.left || ''});
      if (e.type === 'sal') e.salary = Number(pv); else e.rate = Number(pv); e.left = lv; save(); render(); }
    else if (a === 'st-add') { var nm = document.getElementById('n-name').value.trim(), ty = document.getElementById('n-type').value, pv2 = Number(document.getElementById('n-pay').value);
      if (!nm || !(pv2 > 0)) throw new Error(T('名字和工资都要填','name and pay are needed')); if (emp(nm)) throw new Error(T('已经有这个名字','that name is already there'));
      S.setup.employees.push({name: nm, type: ty, rate: ty === 'hr' ? pv2 : 0, salary: ty === 'sal' ? pv2 : 0, hired: document.getElementById('n-hired').value, vacPct: 0.04, added_in_app: {at: nowStr(), by: who()}}); save(); render(); }
    else if (a === 'backup') give('payroll_backup_' + (S.setup ? S.setup.company.replace(/[^A-Za-z0-9]+/g, '_') + '_' : '') + today() + '.json', JSON.stringify({kind:'backup', made: nowStr(), data: S}));
    else if (a === 'co') { switchTo(b.getAttribute('data-c')); render(); alertBox(T('已换到 ','Now on ') + esc(S.setup ? S.setup.company : '')); }
    else if (a === 'count-send') sendCount();
    else if (a === 'count-clear') { S.countDraft = {}; cnWarn = false; save(); render(); }
    else if (a === 'count-resend') { var cr = S.counts.filter(function(x){ return x.name === id; })[0]; give(cr.name, cr.text); }
    else if (a === 'docs') pickPhotos();
    else if (a === 'docs-share') shareDocs();
    else if (a === 'docs-clear') { pending = []; render(); }
    else if (a === 'who') { var v2 = document.getElementById('who').value.trim(); if (S.role === 'boss') S.boss = v2; else S.me = v2; save(); render(); }
    else if (a === 'switch') { S.role = null; save(); render(); }
  } catch (e) { alertBox(esc(e.message)); }
});
document.addEventListener('input', function(ev){ if (ev.target.classList && ev.target.classList.contains('cn')) { S.countDraft = S.countDraft || {}; S.countDraft[ev.target.id] = ev.target.value; cnWarn = false; save(); } });
document.addEventListener('change', function(ev){ if (ev.target.id === 'selEmp') { selEmp = ev.target.value; render(); } else if (ev.target.id && ev.target.id.indexOf('f-') === 0) liveEst(); });
document.addEventListener('input', function(ev){ if (ev.target.id && ev.target.id.indexOf('f-') === 0) liveEst(); });
render();
})();

// ---------- SHA-256 (no crypto.subtle: works from a file and on any phone)
function sha256(str){
  function rr(n, x){ return (x >>> n) | (x << (32 - n)); }
  var K = [], H = [], p = 2, n, i, j;
  function isP(m){ for (var k = 2; k * k <= m; k++) if (m % k === 0) return false; return true; }
  function fr(x){ return ((x - Math.floor(x)) * 4294967296) | 0; }
  for (n = 0; n < 64; p++) if (isP(p)) { if (n < 8) H[n] = fr(Math.pow(p, 1/2)); K[n++] = fr(Math.pow(p, 1/3)); }
  var b = unescape(encodeURIComponent(str)), w = [], l = b.length * 8;
  for (i = 0; i < b.length; i++) w[i >> 2] |= b.charCodeAt(i) << ((3 - i % 4) * 8);
  w[l >> 5] |= 0x80 << (24 - l % 32); w[((l + 64 >> 9) << 4) + 15] = l;
  for (j = 0; j < w.length; j += 16) {
    var a = H.slice(0), W = [];
    for (i = 0; i < 64; i++) {
      if (i < 16) W[i] = w[j + i] | 0;
      else W[i] = (rr(17, W[i-2]) ^ rr(19, W[i-2]) ^ (W[i-2] >>> 10)) + W[i-7] + (rr(7, W[i-15]) ^ rr(18, W[i-15]) ^ (W[i-15] >>> 3)) + W[i-16] | 0;
      var t1 = a[7] + (rr(6, a[4]) ^ rr(11, a[4]) ^ rr(25, a[4])) + ((a[4] & a[5]) ^ (~a[4] & a[6])) + K[i] + W[i] | 0;
      var t2 = (rr(2, a[0]) ^ rr(13, a[0]) ^ rr(22, a[0])) + ((a[0] & a[1]) ^ (a[0] & a[2]) ^ (a[1] & a[2])) | 0;
      a = [t1 + t2 | 0].concat(a); a[4] = a[4] + t1 | 0; a.length = 8;
    }
    for (i = 0; i < 8; i++) H[i] = H[i] + a[i] | 0;
  }
  return H.map(function(x){ return ('00000000' + (x >>> 0).toString(16)).slice(-8); }).join('');
}
// a file we give out: its content + the SHA-256 of that content (the office checks it)
function sealed(obj){ var body = JSON.stringify(obj); return JSON.stringify({sha256: sha256(body), body: body}, null, 0); }
function unseal(text){
  var o = JSON.parse(text);
  if (o && o.body && o.sha256) { if (sha256(o.body) !== o.sha256) throw new Error(T('文件被改过（SHA-256 对不上）','the file was changed (SHA-256 does not match)')); return JSON.parse(o.body); }
  return o;                                                   // a setup file from the office (made by Python, not sealed)
}

// ---------- give files: one share sheet (phone -- one per tap) or downloads (computer)
function give(name, data, type){ giveMany([{name: name, data: data, type: type}]); }
function giveMany(list){
  var blobs = list.map(function(x){ return {name: x.name, blob: new Blob([x.data], {type: x.type || 'application/json'})}; });
  try {
    var files = blobs.map(function(x){ return new File([x.blob], x.name, {type: x.blob.type}); });
    if (navigator.canShare && navigator.canShare({files: files})) { navigator.share({files: files}).catch(function(){}); return; }
  } catch (e) {}
  blobs.forEach(function(x, i){ setTimeout(function(){
    var a = document.createElement('a'); a.href = URL.createObjectURL(x.blob); a.download = x.name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000); }, i * 400); });
}
function pick(accept, cb){
  var i = document.createElement('input'); i.type = 'file'; i.accept = accept || '.json,application/json'; i.multiple = true;
  i.onchange = function(){ Array.prototype.forEach.call(i.files, function(f){ var r = new FileReader(); r.onload = function(){ cb(String(r.result), f.name); }; r.readAsText(f); }); };
  i.click();
}

// ---------- a tiny PDF (text only, Helvetica) for payslips
function pdf(lines, title){
  function enc(s){ return String(s).replace(/[^\x20-\x7e]/g, '?').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)'); }
  var y = 770, ops = ['BT', '/F1 10 Tf'];
  lines.forEach(function(l){
    var big = l && l.charAt(0) === '#'; var t = big ? l.slice(1) : l;
    ops.push((big ? '/F2 13 Tf ' : '/F1 10 Tf ') + '1 0 0 1 50 ' + y + ' Tm (' + enc(t) + ') Tj'); y -= big ? 20 : 14;
  });
  ops.push('ET');
  var content = ops.join('\n');
  var objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>',
    '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream', '<< /Title (' + enc(title || '') + ') /Producer (DropBookAI) >>'];
  var out = '%PDF-1.4\n', off = [];
  objs.forEach(function(o, i){ off.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  var x = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + off.map(function(o){ return ('0000000000' + o).slice(-10) + ' 00000 n \n'; }).join('');
  out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R /Info 7 0 R >>\nstartxref\n' + x + '\n%%EOF';
  return out;
}

function otManual(r){ if (!r.ot_from || !r.ot_to) return ''; var m = DBPay.rowMinutes({start:r.ot_from, end:r.ot_to}); return Math.round(m / 60 * 100) / 100; }
function calcRow(r){ return {date:r.date, start:r.start, end:r.end, 'break':Number(r['break'] || 0), rate:Number(r.rate || 0), stat:!!r.stat,

// ---------- pay periods
function periodFor(freq, anchorEnd){
  var to = anchorEnd || today(), d = new Date(to + 'T00:00:00Z');   // semi / monthly: the period holding this day
  if (freq === 'semi') { var day = d.getUTCDate(), y = d.getUTCFullYear(), m = d.getUTCMonth();
    if (day <= 15) return {from: iso(y, m, 1), to: iso(y, m, 15)};
    return {from: iso(y, m, 16), to: iso(y, m + 1, 0)}; }
  if (freq === 'monthly') return {from: iso(d.getUTCFullYear(), d.getUTCMonth(), 1), to: iso(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)};
  var n = freq === 'weekly' ? 7 : 14; return {from: DBPay.addDays(to, -(n - 1)), to: to};
}
function iso(y, m, d){ return new Date(Date.UTC(y, m, d)).toISOString().slice(0, 10); }
// the period after the last one paid (none yet: the one ending around today)
function nextPeriod(){
  var f = (S.setup || {}).freq || 'semi', last = S.runs.filter(function(r){ return !r.voided; }).map(function(r){ return r.period_to; }).sort().pop();
  if (!last) return periodFor(f, today());
  var nx = DBPay.addDays(last, 1);
  if (f === 'semi' || f === 'monthly') return periodFor(f, nx);
  return {from: nx, to: DBPay.addDays(last, f === 'weekly' ? 7 : 14)};
}
function remitDue(pay, kind){
  var d = new Date(pay + 'T00:00:00Z'), y = d.getUTCFullYear(), m = d.getUTCMonth();
  if (kind === 'quarterly') { var qm = Math.floor(m / 3) * 3 + 3; return iso(y, qm, 15); }
  if (kind === 'accelerated') return d.getUTCDate() <= 15 ? iso(y, m, 25) : iso(y, m + 1, 10);
  return iso(y, m + 1, 15);
}
// year to date: the office's figure (through ytd_through) + the runs posted here after it
function ytdBefore(payDate){
  var y = payDate.slice(0, 4), base = (S.setup || {}).ytd || {}, thr = (S.setup || {}).ytd_through || '', out = {};
  emps().forEach(function(e){ var b = base[e.name] && base[e.name].year === y ? base[e.name] : {}; out[e.name] = {gross:+b.gross || 0, cpp:+b.cpp || 0, cpp2:+b.cpp2 || 0, ei:+b.ei || 0}; });
  S.runs.forEach(function(r){
    if (r.voided || r.pay_date.slice(0, 4) !== y || r.pay_date >= payDate || r.period_to <= thr) return;
    r.result.rows.forEach(function(x){ var o = out[x.name] = out[x.name] || {gross:0, cpp:0, cpp2:0, ei:0};
      o.gross = DBPay.r2(o.gross + x.gross); o.cpp = DBPay.r2(o.cpp + x.cpp); o.cpp2 = DBPay.r2(o.cpp2 + x.cpp2); o.ei = DBPay.r2(o.ei + x.ei); });
  });
  return out;
}
function tablesOk(payDate){
  var eds = TABLES.editions.map(function(e){ return e.effective; }).sort(), last = eds[eds.length - 1];
  var due = DBPay.nextUpdateDue(last);
  return {ok: payDate < due, due: due, edition: DBPay.tableFor(TABLES, payDate).edition};
}

function vPay(){
  var p = lastRun && !lastRun.posted ? {from:lastRun.period_from, to:lastRun.period_to} : nextPeriod();
  var payDate = lastRun && !lastRun.posted ? lastRun.pay_date : p.to;
  var tok = tablesOk(payDate);
  var h = '<div class="card"><h2>' + T('发工资','Pay run') + ' <small class="mut">' + FREQ(S.setup.freq) + '</small></h2>'
    + '<div class="row"><label>' + T('工资期 从','Period from') + '<input type="date" id="p-from" value="' + p.from + '"></label><label>' + T('到','to') + '<input type="date" id="p-to" value="' + p.to + '"></label>'
    + '<label>' + T('发薪日','Pay date') + '<input type="date" id="p-pay" value="' + payDate + '"></label></div>'
    + '<div class="mut sm">' + T('年薪员工的奖金：','Bonus for salaried staff: ') + active(p.to).filter(function(e){ return e.type === 'sal'; }).map(function(e){ return '<label>' + esc(e.name) + '<input type="number" step="0.01" class="p-bon" data-n="' + esc(e.name) + '" style="width:110px" placeholder="0"></label>'; }).join('') + '</div>'
    + (tok.ok ? '' : '<div class="bad">' + T('扣税表过期了（' + tok.due + ' 起 CRA 有新表）：请向会计事务所要新版本，不能算。','The tax tables are out of date (CRA has new ones from ' + tok.due + '): ask the accounting office for the new version.') + '</div>')
    + '<button class="pri" data-a="calc"' + (tok.ok ? '' : ' disabled') + '>' + T('算','Calculate') + '</button></div>';

  return h;
}
function runView(R){
  var r = R.result;
  var flags = R.flags.length ? R.flags.map(function(f){ return '<div class="' + (f.bad ? 'bad' : 'warn') + '">' + esc(f.text) + '</div>'; }).join('') : '';
  var t = '<div class="card"><h2>' + T('结果','Result') + ' <small class="mut">' + esc(R.period_from) + ' – ' + esc(R.period_to) + ' · ' + T('发薪 ','paid ') + esc(R.pay_date) + ' · ' + esc(r.edition) + '</small></h2>' + flags
    + '<div class="tw"><table><tr><th>' + T('员工','Employee') + '</th><th class="n">' + T('工时','Hours') + '</th><th class="n">' + T('工资总额','Gross') + '</th><th class="n">CPP</th><th class="n">CPP2</th><th class="n">EI</th><th class="n">' + T('所得税','Income tax') + '</th><th class="n">' + T('实发','Net') + '</th></tr>'
    + r.rows.map(function(x){ return '<tr><td>' + esc(x.name) + '</td><td class="n">' + hrs(x.hours.reg + x.hours.ot + x.hours.dt + x.hours.stat) + '</td><td class="n">' + money(x.gross) + '</td><td class="n">' + money(x.cpp) + '</td><td class="n">' + money(x.cpp2) + '</td><td class="n">' + money(x.ei) + '</td><td class="n">' + money(x.fed + x.bc) + '</td><td class="n"><b>' + money(x.net) + '</b></td></tr>'; }).join('')
    + '<tr class="tot"><td>' + T('合计','Total') + '</td><td></td><td class="n">' + money(r.gross) + '</td><td class="n">' + money(r.totals.cpp) + '</td><td class="n">' + money(r.totals.cpp2) + '</td><td class="n">' + money(r.totals.ei) + '</td><td class="n">' + money(r.tax) + '</td><td class="n">' + money(r.net) + '</td></tr></table></div>'
    + '<p class="sm">' + T('雇主要另付：CPP $','Employer also pays: CPP $') + money(r.er_cpp) + ' · CPP2 $' + money(r.er_cpp2) + ' · EI $' + money(r.er_ei) + '<br><b>' + T('交给 CRA（PD7A）$','To CRA (PD7A) $') + money(r.remit) + T('，截止 ',', due ') + esc(R.remit_due) + '</b></p>';
  if (!R.posted) t += '<button class="pri" data-a="post"' + (R.flags.some(function(f){ return f.bad && f.block; }) ? ' disabled' : '') + '>' + T('确定发这期工资','Confirm this pay run') + '</button> <span class="mut sm">' + T('确定后才能出工资单、导出给会计','payslips and the file for the accountant come after confirming') + '</span>';
  else t += '<button class="pri" data-a="slips" data-no="' + esc(R.no) + '">' + T('工资单 PDF','Payslips (PDF)') + '</button> <button class="pri" data-a="export-run" data-no="' + esc(R.no) + '">' + T('导出给会计（pay run 文件）','Send to the accountant (pay run file)') + '</button>'
    + (R.exported ? ' <span class="okt sm">' + T('已导出 ','exported ') + esc(R.exported) + '</span>' : '');
  return t + '</div>';
}

// ================= actions =================
function who(){ var n = S.role === 'boss' ? S.boss : S.me; if (!n) throw new Error(T('先在「设置」里写你的名字','first put your name in Settings')); return n; }
function rowById(id){ return S.rows.filter(function(r){ return r.id === id; })[0]; }
function editRow(id){
  var r = rowById(id), f = document.getElementById('dlgf'), whoami = S.role;
  f.innerHTML = '<h2>' + T('改这一天','Change this shift') + '</h2>' + rowForm(r, whoami) + '<div style="text-align:right"><button value="cancel">' + T('取消','Cancel') + '</button> <button class="pri" id="dsave" value="ok">' + T('保存','Save') + '</button></div>';
  document.getElementById('dlg').showModal();
  document.getElementById('dsave').onclick = function(ev){
    try {
      var n = readForm(whoami);
      if (S.role === 'boss' && r.src === 'emp') {             // the boss changes an employee's line: keep what the employee wrote
        r.edits = r.edits || []; var before = {};
        ['date','start','end','break','ot_from','ot_to','stat','rate','bonus','note'].forEach(function(k){ before[k] = r[k]; });
        r.edits.push({at: nowStr(), by: who(), from: before});
      }
      Object.assign(r, n); if (S.role === 'boss') r.use_manual = !!r.ot_from;
      if (S.role === 'boss' && r.src === 'emp') r.approved = null;
      save(); render();
    } catch (e) { ev.preventDefault(); alertBox(esc(e.message)); }
  };
}
function addRow(src){
  var r = readForm(src === 'emp' ? 'emp' : 'boss');
  r.id = uid(); r.emp = src === 'emp' ? S.me : selEmp; r.src = src; r.made = nowStr();
  if (src === 'boss') { r.approved = {by: who(), at: nowStr()}; r.use_manual = !!r.ot_from; }
  S.rows.push(r); save(); render();
}
function importText(text, name){
  var o = unseal(text);
  if (o.kind === 'setup') {
    if (S.setup && S.setup.company !== o.company) throw new Error(T('这个设置文件是 ' + o.company + ' 的，不是 ' + S.setup.company, 'this setup is for ' + o.company + ', not ' + S.setup.company));
    S.setup = o; S.role = 'boss'; save(); tab = 'hours'; render(); return T('已导入设置：','Setup imported: ') + esc(o.company) + ' · ' + o.employees.length + T(' 位员工',' employee(s)');
  }
  if (o.kind === 'hours') {
    if (S.role !== 'boss') throw new Error(T('工时文件要在老板那边导入','hours files are imported on the owner\'s device'));
    var n = 0, dup = 0;
    o.rows.forEach(function(r){
      var same = S.rows.filter(function(x){ return x.emp === o.employee && x.date === r.date && x.start === r.start; })[0];
      if (same) { dup++; return; }                              // the same shift again: kept once (the first one)
      var e = emp(o.employee) || {};
      S.rows.push(Object.assign({}, r, {id: uid(), emp: o.employee, src: 'emp', rate: r.rate || e.rate || 0, bonus: 0, approved: null, use_manual: !!r.ot_from,
        sub: o.sha256 || '', received: nowStr()}));
      n++;
    });
    S.subs.push({emp: o.employee, from: o.from, to: o.to, rows: n, dup: dup, at: nowStr(), file: name});
    save(); tab = 'inbox'; render();
    return esc(o.employee) + ': ' + n + T(' 天收到',' shift(s) in') + (dup ? T('，' + dup + ' 天重复（已有，没再加）', ', ' + dup + ' already there (not added again)') : '');
  }
  if (o.kind === 'backup') { var keep = S.lang; S = Object.assign(blank(), o.data); S.lang = keep; save(); render(); return T('已还原备份 ','Backup restored ') + esc(o.made); }
  throw new Error(T('看不懂这个文件','not a file this app knows'));
}
function calc(){
  var from = document.getElementById('p-from').value, to = document.getElementById('p-to').value, pay = document.getElementById('p-pay').value;
  if (!from || !to || !pay || from > to) throw new Error(T('工资期日期不对','the period dates are not right'));
  if (pay < to) throw new Error(T('发薪日不能早于工资期结束','the pay date cannot be before the period ends'));
  var flags = [];
  if ((new Date(pay) - new Date(to)) / 86400000 > 8) flags.push({bad:true, block:true, text:T('BC：工资期结束后 8 天内要发薪','BC: wages are paid within 8 days of the period end')});
  if (S.runs.some(function(r){ return !r.voided && r.period_to === to; })) flags.push({bad:true, block:true, text:T('这一期已经发过了','this period is already paid')});
  var list = active(to), inputs = {}, statDate = '', detail = {};
  list.forEach(function(e){
    if (e.type === 'sal') { var b = document.querySelector('.p-bon[data-n="' + CSS.escape(e.name) + '"]'); inputs[e.name] = {bonus: b && b.value ? b.value : ''}; return; }
    var rows = rowsOf(e.name);
    var inPer = rows.filter(function(r){ return r.date >= from && r.date <= to; });
    var pend = inPer.filter(function(r){ return !r.approved; });
    if (pend.length) flags.push({bad:true, block:true, text: e.name + ': ' + pend.length + T(' 天工时还没批准',' shift(s) not approved yet')});
    var ts = DBPay.timesheet(rows.map(calcRow), from, to, (S.setup.week_start === undefined ? 6 : S.setup.week_start));
    ts.days.forEach(function(d){ if (d.flag) flags.push({bad: d.flag.indexOf('LESS') >= 0, text: e.name + ' ' + d.date + ': ' + (d.flag.indexOf('LESS') >= 0 ? T('手填的加班少于 BC 规定（照 BC 规定算）','the overtime typed in is less than BC requires (paid as BC requires)') : T('手填的加班多于 BC 规定（照手填的付）','the overtime typed in is more than BC requires (paid as typed)'))}); });
    inPer.forEach(function(r){ if (r.stat && !statDate) statDate = r.date; });
    inputs[e.name] = {reg: ts.reg, ot: ts.ot, dt: ts.dt, stat: ts.stat, bonus: ts.bonus || '', pay: ts.pay};
    detail[e.name] = ts;
  });
  var result = DBPay.compute(TABLES, list, inputs, P_OF[S.setup.freq], statDate, pay, ytdBefore(pay));
  lastRun = {no: '', period_from: from, period_to: to, pay_date: pay, freq: S.setup.freq, stat_date: statDate, inputs: inputs, detail: detail,
    week_start: (S.setup.week_start === undefined ? 6 : S.setup.week_start),
    result: result, remit_due: remitDue(pay, S.setup.remitter || 'regular'), flags: flags, posted: false};
  render();
}
function post(){
  var R = lastRun; if (!R || R.posted) return;
  var y = R.pay_date.slice(0, 4);
  R.no = 'APP-' + y + '-' + ('0' + (S.runs.filter(function(r){ return r.pay_date.slice(0, 4) === y; }).length + 1)).slice(-2);
  R.posted = nowStr(); R.by = who();
  R.employees = active(R.period_to).map(function(e){ return Object.assign({}, e); });
  R.rows = S.rows.filter(function(r){ var e = emp(r.emp); return e && e.type !== 'sal' && r.date >= DBPay.addDays(R.period_from, -6) && r.date <= R.period_to; });
  S.runs.push(JSON.parse(JSON.stringify(R))); save(); render();
}
function runByNo(no){ return S.runs.filter(function(r){ return r.no === no; })[0]; }
function payslips(no){
  var R = runByNo(no), Y = ytdBefore(DBPay.addDays(R.pay_date, 1)), out = [];
  R.result.rows.forEach(function(x){
    var e = emp(x.name) || {}, y = Y[x.name] || {};
    var L = ['#' + S.setup.company, '#PAY STATEMENT  ' + R.period_from + ' to ' + R.period_to + '   paid ' + R.pay_date, '',
      'Employee   ' + x.name, '', 'EARNINGS'];
    if (x.type === 'hourly') {
      L.push(pad('  Regular hours', hrs(x.hours.reg)), pad('  Overtime hours (1.5x)', hrs(x.hours.ot)), pad('  Double time hours (2x)', hrs(x.hours.dt)));
      if (x.hours.stat) L.push(pad('  Stat holiday hours', hrs(x.hours.stat)));
    }
    L.push(pad('  Regular pay', money(x.base)), pad('  Overtime pay', money(x.ot_pay)));
    if (x.stat_pay) L.push(pad('  Stat holiday pay', money(x.stat_pay)));
    if (x.bonus) L.push(pad('  Bonus', money(x.bonus)));
    if (x.vac_pay) L.push(pad('  Vacation pay', money(x.vac_pay)));
    L.push(pad('  GROSS', money(x.gross)), '', 'DEDUCTIONS', pad('  CPP', money(x.cpp)));
    if (x.cpp2) L.push(pad('  CPP2', money(x.cpp2)));
    L.push(pad('  EI', money(x.ei)), pad('  Federal income tax', money(x.fed)), pad('  BC income tax', money(x.bc)), '', pad('NET PAY', money(x.net)), '',
      'YEAR TO DATE', pad('  Gross', money(y.gross)), pad('  CPP', money(y.cpp)), pad('  CPP2', money(y.cpp2)), pad('  EI', money(y.ei)), '',
      'Tax tables: ' + R.result.edition + '.  Prepared with DropBookAI.');
    out.push({name: 'Payslip_' + R.pay_date + '_' + x.name.replace(/[^A-Za-z0-9]+/g, '_') + '.pdf', data: pdf(L, 'Payslip ' + x.name), type: 'application/pdf'});
  });
  giveMany(out);
}
function pad(a, b){ var s = a; while (s.length + String(b).length < 52) s += ' '; return s + b; }
function exportRun(no){
  var R = runByNo(no);
  var body = {kind:'payrun', app_version: APP_VERSION, company: S.setup.company, setup_made: S.setup.made, run: R, made_at: nowStr(), by: who()};
  give('payrun_' + S.setup.company.replace(/[^A-Za-z0-9]+/g, '_') + '_' + R.period_to + '.json', sealed(body));
  R.exported = nowStr(); save(); render();
}

// ================= events =================
document.addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if (!b) return;
  try {
    if (b.parentNode && b.parentNode.id === 'nav') { tab = b.getAttribute('data-t'); render(); return; }
    if (b.id === 'lang') { S.lang = S.lang === 'en' ? 'zh' : 'en'; save(); render(); return; }
    var a = b.getAttribute('data-a'), id = b.getAttribute('data-id');
    if (!a) return;
    if (a === 'role-boss') { S.role = 'boss'; tab = 'hours'; save(); render(); }
    else if (a === 'role-emp') { S.role = 'emp'; tab = 'my'; save(); render(); }
    else if (a === 'me') { var v = document.getElementById('me').value.trim(); if (!v) throw new Error(T('写名字','type your name')); S.me = v; save(); render(); }
    else if (a === 'add-mine') addRow('emp');
    else if (a === 'add-boss') addRow('boss');
    else if (a === 'edit') editRow(id);
    else if (a === 'del') { var r = rowById(id); if (r.approved && S.runs.some(function(x){ return !x.voided && r.date >= x.period_from && r.date <= x.period_to; })) throw new Error(T('这一天已经发过工资，不能删','this day is in a pay run already')); S.rows = S.rows.filter(function(x){ return x.id !== id; }); save(); render(); }
    else if (a === 'approve1') { rowById(id).approved = {by: who(), at: nowStr()}; save(); render(); }
    else if (a === 'approve-all') { var n = b.getAttribute('data-n'), w = who(), at = nowStr(); S.rows.forEach(function(r){ if (r.emp === n && r.src === 'emp' && !r.approved) r.approved = {by: w, at: at}; }); save(); render(); }
    else if (a === 'send-hours') {
      var f = document.getElementById('s-from').value, t = document.getElementById('s-to').value;
      var rows = S.rows.filter(function(r){ return r.emp === S.me && r.date >= f && r.date <= t; }).map(function(r){ return {date:r.date, start:r.start, end:r.end, 'break':r['break'], ot_from:r.ot_from, ot_to:r.ot_to, stat:r.stat, note:r.note}; });
      if (!rows.length) throw new Error(T('这段时间没有记录','no shifts in these dates'));
      var body = JSON.stringify({kind:'hours', app_version: APP_VERSION, employee: S.me, from: f, to: t, rows: rows, made_at: nowStr()});
      var o = JSON.parse(body); o.sha256 = sha256(body);
      give('hours_' + S.me.replace(/[^A-Za-z0-9]+/g, '_') + '_' + f + '_' + t + '.json', JSON.stringify({sha256: o.sha256, body: body}));
    }
    else if (a === 'import') pick('.json,application/json', function(text, name){ try { alertBox(importText(text, name)); } catch (e) { alertBox(esc(name) + ': ' + esc(e.message)); } });
    else if (a === 'calc') calc();
    else if (a === 'post') post();
    else if (a === 'slips') payslips(b.getAttribute('data-no'));
    else if (a === 'export-run') exportRun(b.getAttribute('data-no'));
    else if (a === 'void') { var R = runByNo(b.getAttribute('data-no')); R.voided = nowStr(); R.voided_by = who(); save(); render(); }
    else if (a === 'st-save') { var i = +b.getAttribute('data-i'), e = emps()[i], pv = document.querySelector('.st-pay[data-i="' + i + '"]').value, lv = document.querySelector('.st-left[data-i="' + i + '"]').value;
      e.changes = e.changes || []; e.changes.push({at: nowStr(), by: who(), rate: e.rate, salary: e.salary, left: e.left || ''});
      if (e.type === 'sal') e.salary = Number(pv); else e.rate = Number(pv); e.left = lv; save(); render(); }
    else if (a === 'st-add') { var nm = document.getElementById('n-name').value.trim(), ty = document.getElementById('n-type').value, pv2 = Number(document.getElementById('n-pay').value);
      if (!nm || !(pv2 > 0)) throw new Error(T('名字和工资都要填','name and pay are needed')); if (emp(nm)) throw new Error(T('已经有这个名字','that name is already there'));
      S.setup.employees.push({name: nm, type: ty, rate: ty === 'hr' ? pv2 : 0, salary: ty === 'sal' ? pv2 : 0, hired: document.getElementById('n-hired').value, vacPct: 0.04, added_in_app: {at: nowStr(), by: who()}}); save(); render(); }
    else if (a === 'backup') give('payroll_backup_' + today() + '.json', JSON.stringify({kind:'backup', made: nowStr(), data: S}));
    else if (a === 'who') { var v2 = document.getElementById('who').value.trim(); if (S.role === 'boss') S.boss = v2; else S.me = v2; save(); render(); }
    else if (a === 'switch') { S.role = null; save(); render(); }
  } catch (e) { alertBox(esc(e.message)); }
});
document.addEventListener('change', function(ev){ if (ev.target.id === 'selEmp') { selEmp = ev.target.value; render(); } });
render();
})();
</script>
</body>
